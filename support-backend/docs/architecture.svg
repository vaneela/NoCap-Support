<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#101a30"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F91FC6"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22E8FF"/>
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowMag" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#F91FC6"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1200" height="880" fill="url(#bg)" rx="18"/>

  <!-- title -->
  <text x="40" y="42" fill="#f8fafc" font-size="24" font-weight="700" letter-spacing="0.5">NoCap Support — Backend Architecture</text>
  <rect x="40" y="54" width="300" height="3" fill="url(#brand)" rx="1.5"/>
  <text x="40" y="76" fill="#94a3b8" font-size="12.5">Spring Boot 3.3.5 · Java 21 · Spring Data JPA · SQLite · stateless JWT (HS256)</text>

  <!-- ================= CLIENT TIER ================= -->
  <g filter="url(#soft)">
    <rect x="240" y="100" width="320" height="70" rx="12" fill="#082f3f" stroke="#22E8FF" stroke-width="1.8"/>
    <rect x="640" y="100" width="320" height="70" rx="12" fill="#082f3f" stroke="#22E8FF" stroke-width="1.8"/>
  </g>
  <text x="400" y="132" text-anchor="middle" fill="#f0fdff" font-size="16" font-weight="600">Customer Portal</text>
  <text x="400" y="153" text-anchor="middle" fill="#7dd3fc" font-size="12">React + Vite · /customer</text>
  <text x="800" y="132" text-anchor="middle" fill="#f0fdff" font-size="16" font-weight="600">Staff Portal</text>
  <text x="800" y="153" text-anchor="middle" fill="#7dd3fc" font-size="12">Agent + Admin UI · /staff</text>

  <!-- ================= PROXY ================= -->
  <rect x="455" y="212" width="290" height="56" rx="12" fill="#2e1065" stroke="#818cf8" stroke-width="1.8" filter="url(#soft)"/>
  <text x="600" y="235" text-anchor="middle" fill="#ede9fe" font-size="15" font-weight="600">Vite Dev Server</text>
  <text x="600" y="254" text-anchor="middle" fill="#c4b5fd" font-size="12">/api proxy → :8081</text>

  <path d="M420,170 C470,195 500,200 540,208" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M780,170 C730,195 700,200 660,208" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M600,268 L600,324" fill="none" stroke="#F91FC6" stroke-width="1.8" marker-end="url(#arrowMag)"/>
  <text x="620" y="300" fill="#f9a8d4" font-size="11">all /api requests</text>

  <!-- ================= SPRING BOOT CONTAINER ================= -->
  <rect x="60" y="330" width="780" height="460" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.6"/>
  <text x="84" y="358" fill="#e2e8f0" font-size="15" font-weight="700">SPRING BOOT  ·  :8081</text>
  <rect x="84" y="366" width="120" height="2.5" fill="url(#brand)"/>

  <!-- security row -->
  <g filter="url(#soft)">
    <rect x="85" y="382" width="170" height="58" rx="10" fill="#500724" stroke="#F91FC6" stroke-width="1.6"/>
    <rect x="267" y="382" width="170" height="58" rx="10" fill="#500724" stroke="#F91FC6" stroke-width="1.6"/>
    <rect x="449" y="382" width="170" height="58" rx="10" fill="#500724" stroke="#F91FC6" stroke-width="1.6"/>
    <rect x="631" y="382" width="170" height="58" rx="10" fill="#500724" stroke="#F91FC6" stroke-width="1.6"/>
  </g>
  <text x="170" y="407" text-anchor="middle" fill="#fdf2f8" font-size="14" font-weight="600">CORS</text>
  <text x="170" y="427" text-anchor="middle" fill="#f9a8d4" font-size="11">WebConfig</text>
  <text x="352" y="407" text-anchor="middle" fill="#fdf2f8" font-size="14" font-weight="600">JWT Filter</text>
  <text x="352" y="427" text-anchor="middle" fill="#f9a8d4" font-size="11">HS256 · stateless</text>
  <text x="534" y="407" text-anchor="middle" fill="#fdf2f8" font-size="14" font-weight="600">Role Rules</text>
  <text x="534" y="427" text-anchor="middle" fill="#f9a8d4" font-size="11">SecurityConfig</text>
  <text x="716" y="407" text-anchor="middle" fill="#fdf2f8" font-size="14" font-weight="600">Error Handler</text>
  <text x="716" y="427" text-anchor="middle" fill="#f9a8d4" font-size="11">JSON 401 / 403</text>

  <!-- arrows security -> controllers -->
  <path d="M170,440 L170,462" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M352,440 L352,462" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M534,440 L534,462" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M716,440 L716,462" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- controllers row -->
  <g filter="url(#soft)">
    <rect x="85" y="466" width="170" height="58" rx="10" fill="#451a03" stroke="#fbbf24" stroke-width="1.6"/>
    <rect x="267" y="466" width="170" height="58" rx="10" fill="#451a03" stroke="#fbbf24" stroke-width="1.6"/>
    <rect x="449" y="466" width="170" height="58" rx="10" fill="#451a03" stroke="#fbbf24" stroke-width="1.6"/>
    <rect x="631" y="466" width="170" height="58" rx="10" fill="#451a03" stroke="#fbbf24" stroke-width="1.6"/>
  </g>
  <text x="170" y="491" text-anchor="middle" fill="#fffbeb" font-size="14" font-weight="600">AuthController</text>
  <text x="170" y="511" text-anchor="middle" fill="#fcd34d" font-size="11">register · login · me</text>
  <text x="352" y="491" text-anchor="middle" fill="#fffbeb" font-size="14" font-weight="600">TicketController</text>
  <text x="352" y="511" text-anchor="middle" fill="#fcd34d" font-size="11">tickets · messages</text>
  <text x="534" y="491" text-anchor="middle" fill="#fffbeb" font-size="14" font-weight="600">AgentController</text>
  <text x="534" y="511" text-anchor="middle" fill="#fcd34d" font-size="11">staff CRUD</text>
  <text x="716" y="491" text-anchor="middle" fill="#fffbeb" font-size="14" font-weight="600">StatusController</text>
  <text x="716" y="511" text-anchor="middle" fill="#fcd34d" font-size="11">status machine</text>

  <!-- arrows controllers -> services -->
  <path d="M170,524 L170,546" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M352,524 L352,546" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M534,524 L534,546" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M716,524 L716,546" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- services row -->
  <g filter="url(#soft)">
    <rect x="80" y="550" width="136" height="64" rx="10" fill="#1e1b4b" stroke="#a78bfa" stroke-width="1.6"/>
    <rect x="224" y="550" width="136" height="64" rx="10" fill="#1e1b4b" stroke="#a78bfa" stroke-width="1.6"/>
    <rect x="368" y="550" width="136" height="64" rx="10" fill="#1e1b4b" stroke="#a78bfa" stroke-width="1.6"/>
    <rect x="512" y="550" width="136" height="64" rx="10" fill="#1e1b4b" stroke="#a78bfa" stroke-width="1.6"/>
    <rect x="656" y="550" width="136" height="64" rx="10" fill="#1e1b4b" stroke="#a78bfa" stroke-width="1.6"/>
  </g>
  <text x="148" y="577" text-anchor="middle" fill="#eef2ff" font-size="13.5" font-weight="600">AuthService</text>
  <text x="148" y="596" text-anchor="middle" fill="#c4b5fd" font-size="10.5">issue JWT</text>
  <text x="292" y="577" text-anchor="middle" fill="#eef2ff" font-size="13.5" font-weight="600">AgentService</text>
  <text x="292" y="596" text-anchor="middle" fill="#c4b5fd" font-size="10.5">staff mgmt</text>
  <text x="436" y="577" text-anchor="middle" fill="#eef2ff" font-size="13.5" font-weight="600">TicketService</text>
  <text x="436" y="596" text-anchor="middle" fill="#c4b5fd" font-size="10.5">lifecycle · chat</text>
  <text x="580" y="577" text-anchor="middle" fill="#eef2ff" font-size="13.5" font-weight="600">AccessPolicy</text>
  <text x="580" y="596" text-anchor="middle" fill="#c4b5fd" font-size="10.5">all RBAC rules</text>
  <text x="724" y="577" text-anchor="middle" fill="#eef2ff" font-size="13.5" font-weight="600">JwtService</text>
  <text x="724" y="596" text-anchor="middle" fill="#c4b5fd" font-size="10.5">sign · verify</text>

  <!-- arrows services -> repos -->
  <path d="M170,614 L170,636" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M352,614 L352,636" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M534,614 L534,636" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M716,614 L716,636" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- repositories row -->
  <g filter="url(#soft)">
    <rect x="85" y="640" width="170" height="58" rx="10" fill="#1a2e05" stroke="#a3e635" stroke-width="1.6"/>
    <rect x="267" y="640" width="170" height="58" rx="10" fill="#1a2e05" stroke="#a3e635" stroke-width="1.6"/>
    <rect x="449" y="640" width="170" height="58" rx="10" fill="#1a2e05" stroke="#a3e635" stroke-width="1.6"/>
    <rect x="631" y="640" width="170" height="58" rx="10" fill="#1a2e05" stroke="#a3e635" stroke-width="1.6"/>
  </g>
  <text x="170" y="665" text-anchor="middle" fill="#f7fee7" font-size="13" font-weight="600">AgentRepository</text>
  <text x="170" y="684" text-anchor="middle" fill="#bef264" font-size="10.5">Spring Data JPA</text>
  <text x="352" y="665" text-anchor="middle" fill="#f7fee7" font-size="13" font-weight="600">CustomerRepository</text>
  <text x="352" y="684" text-anchor="middle" fill="#bef264" font-size="10.5">Spring Data JPA</text>
  <text x="534" y="665" text-anchor="middle" fill="#f7fee7" font-size="13" font-weight="600">TicketRepository</text>
  <text x="534" y="684" text-anchor="middle" fill="#bef264" font-size="10.5">Spring Data JPA</text>
  <text x="716" y="665" text-anchor="middle" fill="#f7fee7" font-size="13" font-weight="600">MessageRepository</text>
  <text x="716" y="684" text-anchor="middle" fill="#bef264" font-size="10.5">Spring Data JPA</text>

  <!-- seeder -->
  <rect x="631" y="722" width="170" height="46" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,4"/>
  <text x="716" y="740" text-anchor="middle" fill="#cbd5e1" font-size="12.5" font-weight="600">DataSeeder</text>
  <text x="716" y="757" text-anchor="middle" fill="#94a3b8" font-size="10">seeds staff + passwords</text>

  <!-- arrow repos -> db -->
  <path d="M801,668 C850,668 875,648 920,642" fill="none" stroke="#a3e635" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="858" y="628" text-anchor="middle" fill="#bef264" font-size="11">JPA · Hibernate · JDBC</text>

  <!-- seeder -> db dashed -->
  <path d="M801,744 C860,742 885,705 928,662" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="856" y="724" fill="#94a3b8" font-size="10.5">seed</text>

  <!-- ================= DATABASE ================= -->
  <rect x="920" y="600" width="190" height="104" fill="#160a2b"/>
  <path d="M920,600 L920,704 A95,17 0 0,0 1110,704 L1110,600" fill="#160a2b" stroke="#F91FC6" stroke-width="2"/>
  <ellipse cx="1015" cy="600" rx="95" ry="17" fill="#251243" stroke="#F91FC6" stroke-width="2"/>
  <text x="1015" y="640" text-anchor="middle" fill="#fdf2f8" font-size="17" font-weight="700">SQLite</text>
  <text x="1015" y="660" text-anchor="middle" fill="#f9a8d4" font-size="11.5">support.db</text>
  <text x="1015" y="684" text-anchor="middle" fill="#94a3b8" font-size="10">tickets · messages · agents · customers</text>
  <text x="1015" y="572" text-anchor="middle" fill="#f9a8d4" font-size="11">DATABASE</text>

  <!-- jwt note card -->
  <rect x="905" y="382" width="225" height="118" rx="10" fill="#0b1220" stroke="#334155" stroke-width="1.3" stroke-dasharray="5,4"/>
  <text x="922" y="406" fill="#22E8FF" font-size="11" font-weight="700">AUTH MODEL</text>
  <text x="922" y="426" fill="#cbd5e1" font-size="10.5">Authorization: Bearer &#60;JWT&#62;</text>
  <text x="922" y="443" fill="#cbd5e1" font-size="10.5">AuthUser built from claims —</text>
  <text x="922" y="460" fill="#cbd5e1" font-size="10.5">no server session, no DB hit.</text>
  <text x="922" y="484" fill="#f9a8d4" font-size="10.5">Actor always comes from token,</text>
  <text x="922" y="498" fill="#f9a8d4" font-size="10.5">never from request body.</text>

  <!-- ================= LEGEND ================= -->
  <g>
    <rect x="60" y="818" width="14" height="14" rx="3" fill="#500724" stroke="#F91FC6"/>
    <text x="80" y="830" fill="#cbd5e1" font-size="12">Security</text>
    <rect x="170" y="818" width="14" height="14" rx="3" fill="#451a03" stroke="#fbbf24"/>
    <text x="190" y="830" fill="#cbd5e1" font-size="12">Controllers</text>
    <rect x="292" y="818" width="14" height="14" rx="3" fill="#1e1b4b" stroke="#a78bfa"/>
    <text x="312" y="830" fill="#cbd5e1" font-size="12">Services</text>
    <rect x="408" y="818" width="14" height="14" rx="3" fill="#1a2e05" stroke="#a3e635"/>
    <text x="428" y="830" fill="#cbd5e1" font-size="12">Repositories</text>
    <rect x="552" y="818" width="14" height="14" rx="3" fill="#082f3f" stroke="#22E8FF"/>
    <text x="572" y="830" fill="#cbd5e1" font-size="12">Client / Edge</text>
    <rect x="692" y="818" width="14" height="14" rx="3" fill="none" stroke="#94a3b8" stroke-dasharray="4,3"/>
    <text x="712" y="830" fill="#cbd5e1" font-size="12">Startup / Note</text>
  </g>
</svg>
