spring.application.name=support-backend
server.port=8081

spring.datasource.url=jdbc:sqlite:${SUPPORT_DB_PATH:support.db}?foreign_keys=on
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite allows a single writer; one pooled connection avoids SQLITE_BUSY errors
spring.datasource.hikari.maximum-pool-size=1

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.jackson.serialization.write-dates-as-timestamps=false

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:[*],http://127.0.0.1:[*]}
app.seed-agents=true
# Dev-only password assigned to seeded staff accounts that have none
app.seed-password=${SEED_PASSWORD:changeme123}

# HS256 signing key, must be at least 32 bytes. Always override JWT_SECRET outside local dev.
app.jwt.secret=${JWT_SECRET:dev-only-insecure-jwt-secret-change-me-0123456789}
app.jwt.ttl=${JWT_TTL:PT8H}
