<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F91FC6"/>
      <stop offset="0.5" stop-color="#A855F7"/>
      <stop offset="1" stop-color="#22E8FF"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- app tile -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#0d0b1e"/>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#glass)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="url(#neon)" stroke-opacity="0.55" stroke-width="1.5"/>

  <!-- ticket -->
  <g filter="url(#glow)">
    <path d="M14 20 h36 a4 4 0 0 1 4 4 v4 a6 6 0 0 0 0 12 v4 a4 4 0 0 1 -4 4 H14 a4 4 0 0 1 -4 -4 v-4 a6 6 0 0 0 0 -12 v-4 a4 4 0 0 1 4 -4 z"
          fill="url(#glass)" stroke="url(#neon)" stroke-width="2.5"/>
    <!-- perforation notches -->
    <circle cx="14" cy="32" r="3.4" fill="#0d0b1e"/>
    <circle cx="50" cy="32" r="3.4" fill="#0d0b1e"/>
    <!-- status lines -->
    <rect x="22" y="24" width="12" height="3" rx="1.5" fill="#22E8FF" opacity="0.9"/>
    <rect x="22" y="30.5" width="20" height="3" rx="1.5" fill="#A855F7" opacity="0.9"/>
    <rect x="22" y="37" width="16" height="3" rx="1.5" fill="#F91FC6" opacity="0.9"/>
  </g>
</svg>
